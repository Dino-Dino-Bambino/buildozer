on:
  push:
    branches: [ "**" ]
  workflow_dispatch: # Добавлена кнопка ручного запуска!

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

name: Android Integration
jobs:
  Integration:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Buildozer and dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython git+https://github.com

    - name: Install Linux Packages
      run: |
        sudo apt update
        sudo apt -y install automake libltdl-dev libffi-dev bitcoind autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libsqlite3-dev tk-dev libgdbm-compat-dev

    - name: Pre-install Android SDK Tools
      run: |
        # Автоматически принимаем все лицензии Android SDK и ставим build-tools
        mkdir -p ~/.android && touch ~/.android/repositories.cfg
        yes | sdkmanager --licenses
        sdkmanager "build-tools;34.0.0" "platform-tools" "platforms;android-34"

    - name: Debug Build APK
      run: |
        export BUILDOZER_ALLOW_ORG_TEST_DOMAIN=1
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kivy-App-APK
        path: bin/*.apk
